name: Kyokushin NN CI

on:
  push:
    branches:
      - project/kyokushin-nn
    paths:
      - "kyokushin-nn/**"
      - ".github/workflows/kyokushin-nn-ci.yml"
  pull_request:
    branches:
      - project/kyokushin-nn
    paths:
      - "kyokushin-nn/**"
      - ".github/workflows/kyokushin-nn-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: kyokushin-nn/package.json

      - name: Verify site
        run: npm --prefix kyokushin-nn run check
