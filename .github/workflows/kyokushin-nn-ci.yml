name: Kyokushin NN CI

on:
  push:
    branches:
      - project/kyokushin-nn
    paths:
      - "kyokushin-nn/**"
      - ".github/workflows/kyokushin-nn-ci.yml"
  pull_request:
    branches:
      - project/kyokushin-nn
    paths:
      - "kyokushin-nn/**"
      - ".github/workflows/kyokushin-nn-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify site
        run: npm --prefix kyokushin-nn run check

      - name: Publish production bundle
        uses: actions/upload-artifact@v4
        with:
          name: kyokushin-nn-production
          path: kyokushin-nn/dist/index.html
          if-no-files-found: error
          retention-days: 14
